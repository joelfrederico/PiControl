[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "picontrol"
version = "0.1.0"
description = "Receive controller input from the PiControl iOS app over BLE; optionally expose it as a virtual DualSense"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bless>=0.2.6",
]

[project.optional-dependencies]
uinput = ["evdev>=1.6"]
dev = ["pytest>=7"]

[project.scripts]
picontrol-dualsense = "picontrol.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
